  </g>
  <g fill="#ffffff">
    <rect x="32.5" y="32.5" width="9" height="9" rx="1.5"/>
    <rect x="68.5" y="32.5" width="9" height="9" rx="1.5"/>
    <rect x="32.5" y="68.5" width="9" height="9" rx="1.5"/>
