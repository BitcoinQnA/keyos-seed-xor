  <g stroke="#d4a394" stroke-width="5.5" stroke-linecap="round">
    <line x1="25.75" y1="55" x2="84.25" y2="55"/>
    <line x1="55" y1="25.75" x2="55" y2="84.25"/>
  </g>
</svg>
